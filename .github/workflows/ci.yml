name: CI/CD - Pipeline de Integração e Entrega Contínua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Instala as dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      # Executa o lint
      - name: Lint com flake8
        run: |
          flake8 src/ tests/ --max-line-length=100

      # Executa os testes e gera o relatório HTML
      - name: Executar testes e gerar relatório HTML
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --html=report/index.html --self-contained-html

      # Envia o relatório para o GitHub Pages
      - name: Enviar relatório como artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

  deploy:
    name: Deploy (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4